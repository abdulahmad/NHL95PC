name: fullcheck
on:
  pull_request:
  push:
    branches: [main]
jobs:
  fullcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm dosbox
          pip install capstone==5.0.7
      - name: Compiler setup
        run: python3 tools/cc.py check
      - name: make fullcheck
        run: make fullcheck
